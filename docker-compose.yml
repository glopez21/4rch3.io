services:
  portal:
    build: .
    container_name: 4rch3-portal
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portal_data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    group_add:
      - "108"
    environment:
      - TZ=America/New_York
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`4rch3.io`) || Host(`portal.4rch3.io`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.routers.portal.tls.certresolver=cloudflare"
      - "traefik.http.services.portal.loadbalancer.server.port=8081"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.portal.middlewares=security-headers@file,rate-limit@file,cf-access-auth@file"
      - "4rch3.io.enable=true"
      - "4rch3.io.service=portal"
      - "4rch3.io.name=4rch3 Portal"
      - "4rch3.io.description=Homelab operations portal"
      - "4rch3.io.health=/api/health"
      - "4rch3.io.port=8081"
      - "4rch3.io.public=true"
      - "4rch3.io.category=devops"

volumes:
  portal_data:

networks:
  proxy-net:
    external: true
    name: proxy-net
